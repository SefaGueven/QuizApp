<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/brain result.png" type="image/x-icon" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
    <script src="question_db.js"></script>
    <title>QuizApp</title>
</head>

<body onload="init()">
    <!-- As a heading -->
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <img src="assets/brain_result.png" class="complete-img" alt="card-img">
            <span class="navbar-brand mb-0 h1">QuizApp</span>
        </div>
        <div class="container">

            <div class="card quiz-card" id="endScreen" style="display: none;">
                <div class="text-center"> Quiz Beendet!!
                </div>
                <div class="text-center"> Your Score <b id="amount-of-right-question">___ </b>/<b
                        id="all-questions-end"> ___</b>
                </div>
                <div class="width-100 "><img src="assets/tropy.png" alt="Tropy">
                </div>

            </div>

            <div class="card quiz-card" >
                <img src="assets/img/Linear.jpg" id="header-image" class="card-img-top"  alt="card-img">
                <div class="progress" role="progressbar">
                    <div class="progress-bar text-bg-danger" id="progress_bar" style="width: 0%">0%</div>
                </div>


                <div class="card-body" id="questionBody">
                    <h5 class="card-title" id="questiontext">Frage</h5>
                    <div onclick="answer('answer_1')" class="card quiz-answer-card mb-2">
                        <div class="card-body" id="answer_1">
                            Antwort
                        </div>
                    </div>
                    <div onclick="answer('answer_2')" class="card quiz-answer-card mb-2">
                        <div class="card-body" id="answer_2">
                            Antwort
                        </div>
                    </div>
                    <div onclick="answer('answer_3')" class="card quiz-answer-card mb-2">
                        <div class="card-body" id="answer_3">"
                            Antwort
                        </div>
                    </div>
                    <div onclick="answer('answer_4')" class="card quiz-answer-card mb-2">
                        <div class="card-body" id="answer_4">
                            Antwort
                        </div>
                    </div>

                    <div class="question-footer">
                        <span><b id="question-counter">1</b> von <b id="all-questions">5</b> Fragen
                        </span>
                        <button onclick=" nextQuestion()" class="btn btn-danger" disabled id="next-button">Nächste
                            Frage</button>
                    </div>

                </div>
            </div>
        </div>
    </nav>
</body>

</html>
